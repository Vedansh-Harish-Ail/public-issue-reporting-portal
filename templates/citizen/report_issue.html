{% from "macros.html" import back_button %}
{% extends "base.html" %}
{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/citizen.css') }}">
{% endblock %}

{% block content %}

<!-- HERO SECTION -->
<div class="hero-section"
  style="background-image: linear-gradient(rgba(31, 63, 109, 0.85), rgba(31, 63, 109, 0.85)); padding: 20px 0; margin-bottom: 0; border-radius: 0;">

  <div class="container">
    <h1 style="font-size: 2.2rem; margin: 0; text-align: center; color: white;">{{ get_text('Report Issue') }}</h1>
  </div>
</div>

<div class="section-padding bg-light" style="padding: 60px 0;">
  <div class="container">
    {{ back_button(get_text) }}
    <div class="report-form-card glass-card">

      <div style="margin-bottom: 40px; text-align: center;">
        <p style="color: #666; font-size: 1.1rem;">{{ get_text('Report_Issue_Desc') }}</p>
      </div>

      <form method="post" enctype="multipart/form-data">
        <div class="form-grid-row">
          <!-- Panchayath Selection -->
          <div class="form-group" style="margin-bottom: 25px;">
            <label style="font-weight: 700; color: #4a5568; font-size: 14px; margin-bottom: 8px; display: block;">{{
              get_text('select_panchayath') }}</label>
            <select name="panchayath_id" class="form-control" required>
              <option value="">{{ get_text('select_option') }}</option>
              {% for p in panchayaths %}
              <option value="{{ p.id }}">{{ p.name }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Category -->
          <div class="form-group" style="margin-bottom: 25px;">
            <label style="font-weight: 700; color: #4a5568; font-size: 14px; margin-bottom: 8px; display: block;">{{
              get_text('issue_category') }}</label>
            <select name="category" id="categorySelect" class="form-control" required>
              <option value="">{{ get_text('select_option') }}</option>
              <option value="Garbage Collection">{{ get_text('cat_garbage') }}</option>
              <option value="Water Supply">{{ get_text('cat_water') }}</option>
              <option value="Road Maintenance">{{ get_text('cat_road') }}</option>
              <option value="Street Lights">{{ get_text('cat_light') }}</option>
              <option value="Drainage">{{ get_text('cat_drainage') }}</option>
              <option value="Others">{{ get_text('cat_others') }}</option>
            </select>
          </div>
        </div>

        <!-- Hidden Field for Other Category -->
        <div id="otherCategoryField" class="form-group" style="margin-bottom: 25px; display: none;">
          <label style="font-weight: 700; color: #4a5568; font-size: 14px; margin-bottom: 8px; display: block;">
            {{ get_text('specify_other_issue') }}
          </label>
          <input type="text" name="other_category_name" id="otherCategoryInput" class="form-control"
            placeholder="{{ get_text('other_issue_placeholder') }}">
        </div>

        <!-- Location -->
        <div class="form-group" style="margin-bottom: 25px;">
          <label style="font-weight: 700; color: #4a5568; font-size: 14px; margin-bottom: 8px; display: block;">{{
            get_text('location_neighborhood') }}</label>
          <input type="text" name="location" class="form-control" required
            placeholder="{{ get_text('location_placeholder') }}">
        </div>

        <!-- Description -->
        <div class="form-group" style="margin-bottom: 25px;">
          <label style="font-weight: 700; color: #4a5568; font-size: 14px; margin-bottom: 8px; display: block;">{{
            get_text('detailed_description') }}</label>
          <textarea name="description" rows="5" class="form-control" required
            placeholder="{{ get_text('description_placeholder') }}"></textarea>
        </div>

        <!-- Image Upload -->
        <div class="form-group"
          style="margin-bottom: 35px; border: 2px dashed #e2e8f0; padding: 30px; border-radius: 15px; text-align: center; background: #f8fafc;">
          <label style="font-weight: 700; color: #4a5568; font-size: 14px; margin-bottom: 15px; display: block;">{{
            get_text('attach_photo') }}</label>
          <input type="file" name="image" accept="image/*" class="file-input"
            style="display: block; margin: 0 auto; color: #718096;">
        </div>

        <!-- Submit -->
        <button type="submit" class="login-btn hover-float"
          style="width: 100%; padding: 15px; border-radius: 30px; font-size: 16px; box-shadow: 0 5px 15px rgba(246, 141, 46, 0.2);">{{
          get_text('submit_complaint') }}</button>
      </form>
    </div>
  </div>
</div>


<script>
  const categorySelect = document.getElementById('categorySelect');
  const otherField = document.getElementById('otherCategoryField');
  const otherInput = document.getElementById('otherCategoryInput');

  if (categorySelect) {
    categorySelect.addEventListener('change', function () {
      if (this.value === 'Others') {
        otherField.style.display = 'block';
        otherInput.setAttribute('required', 'required');
      } else {
        otherField.style.display = 'none';
        otherInput.removeAttribute('required');
        otherInput.value = ''; // Clear if they switch back
      }
    });

    // Handle case where it might be pre-selected on reload
    if (categorySelect.value === 'Others') {
      otherField.style.display = 'block';
      otherInput.setAttribute('required', 'required');
    }
  }

  // Double Submit Prevention
  const form = document.querySelector('form');
  if (form) {
    form.addEventListener('submit', function () {
      const btn = this.querySelector('button[type="submit"]');
      if (btn) {
        setTimeout(() => {
          btn.disabled = true;
          btn.style.opacity = '0.7';
          btn.innerHTML = '{{ get_text("processing") }}...';
        }, 10);
      }
    });
  }
</script>
{% endblock %}
